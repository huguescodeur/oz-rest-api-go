services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-oz}
      POSTGRES_PASSWORD: ${DB_PASS:-oz_secret}
      POSTGRES_DB: ${DB_NAME:-oz_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oz} -d ${DB_NAME:-oz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_ADDR=db:5432
    ports:
      - "8080:8080"

volumes:
  postgres_data:
